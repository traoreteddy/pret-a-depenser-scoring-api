# Pipeline CI/CD : qualité → tests → image Docker (GHCR) → déploiement simulé.
# Chaque push sur main (et chaque PR) déclenche lint, typage et tests ; l'image n'est
# construite et publiée que si les tests passent ; le déploiement simulé lance ensuite
# l'image publiée avec docker compose et exécute le test de fumée.
name: CI/CD

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  UV_VERSION: "0.11.20"
  PYTHON_VERSION: "3.13"
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv python install ${{ env.PYTHON_VERSION }}
      - run: uv sync --frozen --only-group dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  typecheck:
    name: Typage (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv python install ${{ env.PYTHON_VERSION }}
      - run: uv sync --frozen --all-extras --group dev
      - run: uv run mypy

  test:
    name: Tests (pytest + couverture)
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: scoring
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD || 'ci_password' }}
          POSTGRES_DB: scoring_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U scoring -d scoring_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://scoring:${{ secrets.POSTGRES_PASSWORD || 'ci_password' }}@localhost:5432/scoring_test
      MLFLOW_DISABLE_AGENT_HINT: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv python install ${{ env.PYTHON_VERSION }}
      - run: uv sync --frozen --all-extras --group dev
      - name: Tests unitaires, API, intégration et modèle réel
        run: uv run pytest --cov --cov-report=xml --cov-report=term --cov-fail-under=85
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage.xml

  build-push:
    name: Image Docker → GHCR
    runs-on: ubuntu-latest
    needs: test
    outputs:
      tag: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Connexion au registre GitHub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-simulated:
    name: Déploiement simulé (docker compose + smoke test)
    runs-on: ubuntu-latest
    needs: build-push
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Configuration éphémère (secrets → .env, jamais commité)
        run: |
          cat > .env <<EOT
          IMAGE=${{ env.IMAGE }}:${{ needs.build-push.outputs.tag }}
          POSTGRES_USER=scoring
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD || 'ci_password' }}
          POSTGRES_DB=scoring_prod
          DATABASE_URL=postgresql://scoring:${{ secrets.POSTGRES_PASSWORD || 'ci_password' }}@db:5432/scoring_prod
          DB_ENABLED=${{ vars.DEPLOY_DB_ENABLED || 'false' }}
          MODEL_BACKEND=${{ vars.MODEL_BACKEND || 'pyfunc' }}
          EOT
      - name: Déploiement
        run: docker compose pull api && docker compose up -d --no-build
      - name: Test de fumée
        run: bash scripts/smoke_test.sh http://localhost:8000 120
      - name: Logs API (en cas d'échec)
        if: failure()
        run: docker compose logs api
      - name: Nettoyage
        if: always()
        run: docker compose down -v
