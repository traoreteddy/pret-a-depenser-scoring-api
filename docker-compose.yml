# Stack locale : API de scoring, stockage des données de production (PostgreSQL + pgAdmin),
# monitoring technique (Prometheus + Grafana) et dashboard Streamlit (profil dashboard).
name: pret-a-depenser

x-postgres-env: &postgres-env
  POSTGRES_USER: ${POSTGRES_USER:-scoring}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?définir POSTGRES_PASSWORD dans .env}
  POSTGRES_DB: ${POSTGRES_DB:-scoring_prod}

services:
  api:
    image: ${IMAGE:-scoring-api:local}
    build:
      context: .
      args:
        INSTALL_EXTRAS: ${INSTALL_EXTRAS:-}
    container_name: scoring-api
    env_file:
      - .env
    environment:
      APP_ENV: prod
      LOG_FORMAT: json
      MODEL_BACKEND: ${MODEL_BACKEND:-xgb_native}
      XGB_NTHREAD: ${XGB_NTHREAD:-1}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-1}
      PREDICT_IN_THREADPOOL: ${PREDICT_IN_THREADPOOL:-false}
      DB_ENABLED: ${DB_ENABLED:-true}
      # Dans le réseau compose la base s'appelle « db » (le .env vise localhost:5433 pour l'hôte)
      DATABASE_URL: postgresql://${POSTGRES_USER:-scoring}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-scoring_prod}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2g

  db:
    image: postgres:17-alpine
    container_name: scoring-db
    environment: *postgres-env
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-scoring} -d ${POSTGRES_DB:-scoring_prod}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: scoring-pgadmin
    profiles: ["tools"]
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:?définir PGADMIN_DEFAULT_PASSWORD dans .env}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    volumes:
      - ./monitoring/pgadmin/servers.json:/pgadmin4/servers.json:ro
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    depends_on:
      db:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: scoring-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      - api
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.6.0
    container_name: scoring-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?définir GRAFANA_ADMIN_PASSWORD dans .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    container_name: scoring-dashboard
    profiles: ["dashboard"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-scoring}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-scoring_prod}
    ports:
      - "${DASHBOARD_PORT:-8501}:8501"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  promdata:
  grafanadata:
