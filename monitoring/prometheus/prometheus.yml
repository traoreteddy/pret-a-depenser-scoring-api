# Prometheus : collecte des métriques de l'API toutes les 5 s.
global:
  scrape_interval: 5s
  evaluation_interval: 15s

scrape_configs:
  - job_name: scoring-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
        labels:
          service: scoring-api
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
