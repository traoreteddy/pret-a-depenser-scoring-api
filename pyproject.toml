[project]
name = "scoring-api"
version = "0.1.0"
description = "API de scoring crédit « Prêt à Dépenser » : déploiement, monitoring et optimisation du modèle (OpenClassrooms P8)"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = { text = "MIT" }
authors = [{ name = "Teddy Traoré", email = "traoreadaire@gmail.com" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "orjson>=3.10",
    "structlog>=24.4",
    "prometheus-client>=0.21",
    "psycopg[binary,pool]>=3.2",
    "numpy==2.5.3",
    "xgboost==3.4.1",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
# Backend « pyfunc » : versions exactes nécessaires pour dépickler le modèle P6
pyfunc = [
    "mlflow-skinny==3.16.1",
    "scikit-learn==1.9.1",
    "pandas==3.0.5",
    "scipy==1.18.1",
    "cloudpickle==3.1.2",
    "psutil>=7",
    "pyarrow>=17",
]
onnx = [
    "onnxruntime>=1.20",
    "onnxmltools>=1.13",
    "onnx>=1.17",
    "skl2onnx>=1.18",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.7",
    "mypy>=1.13",
    "pre-commit>=4",
    "types-psutil",
    "types-pyyaml>=6.0.12.20260906",
    "httpx2>=2.13.1",
]
analysis = [
    "evidently>=0.7",
    "streamlit>=1.40",
    "plotly>=5.24",
    "jupyterlab>=4.3",
    "nbconvert>=7",
    "ipykernel>=6",
    "pyarrow>=17",
    "matplotlib>=3.9",
    "pandas==3.0.5",
    "scikit-learn==1.9.1",
]
bench = [
    "locust>=2.32",
    "py-spy>=0.4",
    "snakeviz>=2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scoring_api"]

[tool.hatch.build]
include = ["src/scoring_api/**/*.py", "src/scoring_api/**/*.sql"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests", "scripts", "simulation", "benchmarks", "dashboard"]
exclude = ["notebooks", ".venv", "models", "data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF", "PL"]
ignore = ["PLR0913", "PLR2004", "RUF001", "RUF002", "RUF003", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004", "S101"]

[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true
warn_unused_ignores = false
plugins = ["pydantic.mypy"]
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "slow: tests qui chargent le vrai modèle",
    "integration: tests nécessitant PostgreSQL (DATABASE_URL)",
]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["scoring_api"]
branch = true
omit = ["src/scoring_api/monitoring/*", "src/scoring_api/observability/otel.py"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = false
